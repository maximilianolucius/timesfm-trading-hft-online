[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timesfm-trading-ft-online"
version = "0.1.0"
description = "Production-ready TimesFM fine-tuning and trading toolkit"
authors = [{name = "TimesFM Trading Maintainers"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "typer[all]>=0.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  "pydantic>=1.10,<2",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "requests>=2.31",
  "yfinance>=0.2",
  "PyMySQL>=1.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
mt5 = [
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]
quant = [
  "timesfm @ git+https://github.com/google-research/timesfm",
]

[tool.ruff]
line-length = 100
extend-select = ["I", "C90", "E", "F", "W"]
ignore = ["E203", "E266", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict = false
